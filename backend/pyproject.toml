[project]
name = "vitainspire-backend"
version = "0.1.0"
description = "Imparency backend: identity, tenancy, verification, audit (foundation slice)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn==0.32.*",
  "sqlalchemy==2.0.*",
  "psycopg[binary]==3.2.*",
  "pydantic==2.*",
  "pydantic-settings==2.*",
  "argon2-cffi==23.*",
  "email-validator==2.*",
  "alembic==1.14.*",
  "python-multipart==0.0.*",
  # Used only by app.ai.assist for the optional live verification-assist call (VITA_LLM_API_KEY).
  # Without a key configured, the app never makes an outbound request through it.
  "httpx==0.27.*",
  # Used for website extraction to populate profile fields (mission, vision, founded year, about).
  "beautifulsoup4==4.*",
  # Used by app.ai.document_assist to read per-page text from uploaded compliance PDFs so a
  # reviewer gets a cited summary instead of a whole file. Pure Python, no system packages.
  # It was already present transitively; declaring it so the feature does not rest on that.
  "pypdf==5.*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit list: the flat layout otherwise makes setuptools refuse to guess (app and migrations both top-level).
packages = ["app", "app.routers", "app.domain", "app.documents", "app.ai", "app.services"]

[project.optional-dependencies]
dev = ["pytest==8.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
