# Render Blueprint for the backend + its Postgres database.
# Import this repo at https://dashboard.render.com/blueprints -- Render reads this file
# automatically. The frontend is deployed separately on Vercel (see README deployment notes).
#
# Free-tier caveats, read before relying on this for anything but a demo:
# - The web service's disk is ephemeral: anything written to VITA_STORAGE_DIR (uploaded NGO
#   compliance documents, PAN proofs) is lost on every redeploy or restart. A persistent disk
#   is a paid Render add-on.
# - The free Postgres database expires 90 days after creation and is not automatically renewed.
# - The free web service spins down after inactivity; the next request pays a cold-start cost.
services:
  - type: web
    name: imparency-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITA_DATABASE_URL
        fromDatabase:
          name: imparency-db
          property: connectionString
      - key: VITA_STORAGE_DIR
        value: /opt/render/project/storage
      - key: VITA_SESSION_TTL_HOURS
        value: "168"
      - key: VITA_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: VITA_LLM_API_KEY
        sync: false # set manually in the Render dashboard -- never stored in this file

databases:
  - name: imparency-db
    plan: free
